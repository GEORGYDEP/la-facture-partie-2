<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧾 La facture — Partie 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1322; --bg2:#151c31; --bg3:#0a0e1a; --card:#1a2340; --card2:#202b4d;
  --accent:#22d68a; --orange:#ff8a3d; --gold:#ffc94d; --blue:#5aa9ff;
  --text:#eef2ff; --text2:#a9b2cf; --text3:#6c779c; --border:#2b3658;
  --success:#22d68a; --error:#ff4060; --radius:16px;
  --paper:#fcfbf7; --ink:#1f2636; --ink2:#5d6579; --rule:#dcd8cc; --fill:#fff3bf;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;
  background-image:radial-gradient(1200px 600px at 10% -10%,rgba(34,214,138,.07),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(255,138,61,.06),transparent 60%)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
b{font-weight:700}
.mono{font-family:'Space Mono',monospace}

/* ===== HEADER / HUD ===== */
header{position:sticky;top:0;z-index:100;background:rgba(14,19,34,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.hud{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-size:1.5rem}
.apptitle{font-weight:800;font-size:1rem;letter-spacing:.2px;white-space:nowrap}
.apptitle small{display:block;font-weight:500;font-size:.72rem;color:var(--text2)}
.hud .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--border);font-size:.82rem;font-weight:700;white-space:nowrap}
.pill.streak.hot{border-color:var(--orange);color:var(--orange);animation:pulse 1s ease-in-out infinite}
.iconbtn{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:5px 9px;font-size:.95rem}
.iconbtn:hover{border-color:var(--accent)}
#globalTimer{font-family:'Space Mono',monospace;font-size:.82rem;color:var(--text2)}
.xpwrap{max-width:980px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:12px}
.xprank{font-size:.8rem;font-weight:700;white-space:nowrap;min-width:150px}
.xptrack{flex:1;height:10px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);position:relative;overflow:visible}
.xpfill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .6s ease}
.xpmark{position:absolute;top:-3px;width:2px;height:14px;background:var(--text3);border-radius:2px}
.xpnext{font-size:.72rem;color:var(--text2);white-space:nowrap;min-width:150px;text-align:right}
.lvpips{display:flex;gap:5px}
.lvpip{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:800;background:var(--bg2);border:1px solid var(--border);color:var(--text2)}
.lvpip.done{background:var(--accent);color:#06281a;border-color:var(--accent)}
.lvpip.cur{border-color:var(--gold);color:var(--gold)}
.lvpip.locked{opacity:.4}

main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
.screen.enter{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== BOUTONS ===== */
.btn{border:none;border-radius:12px;padding:12px 20px;font-weight:700;font-size:1rem;background:var(--accent);color:#062517;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.orange{background:var(--orange);color:#2b1200}
.btn.gold{background:var(--gold);color:#2b2000}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btnrow.c{justify-content:center}
.lbbtn{padding:10px 18px;border-radius:10px;font-weight:700;background:transparent;font-size:.9rem}
.lbbtn.app{border:1px solid var(--accent);color:var(--accent)}
.lbbtn.app:hover{background:var(--accent);color:#062517}
.lbbtn.glob{border:1px solid var(--orange);color:var(--orange)}
.lbbtn.glob:hover{background:var(--orange);color:#2b1200}

/* ===== ACCUEIL ===== */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;margin-top:10px}
.hero h1{font-size:2.6rem;line-height:1.08;font-weight:800;letter-spacing:-.5px}
.hero h1 span{display:block;font-size:1.05rem;font-weight:600;color:var(--text2);letter-spacing:0;margin-top:10px}
.hero p.lead{color:var(--text2);margin-top:14px;max-width:46ch}
.counters{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.counter{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:.85rem}
.counter b{font-size:1.05rem}
.who{margin-top:16px;font-size:.85rem;color:var(--text2)}
.who b{color:var(--accent)}
.mini-inv{background:var(--paper);color:var(--ink);border-radius:6px;padding:18px 18px 22px;transform:rotate(-3deg);box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.05);position:relative;max-width:340px;justify-self:center;width:100%}
.mini-inv::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--orange);border-radius:6px 6px 0 0}
.mini-inv .t{font-weight:800;font-size:1.3rem;letter-spacing:1px;margin-top:6px}
.mini-inv .bar{height:7px;border-radius:4px;background:#e4e0d4;margin:7px 0}
.mini-inv .row{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--ink2);margin:6px 0}
.mini-inv .q{font-family:'Space Mono',monospace;background:var(--fill);border-bottom:2px dotted #b9a64a;padding:0 10px;color:#8a7a2a;font-weight:700}
.stamp{position:absolute;right:14px;top:22px;transform:rotate(-14deg);border:3px solid var(--error);color:var(--error);font-weight:800;padding:4px 10px;border-radius:6px;font-size:.85rem;opacity:.85;letter-spacing:.5px}

/* ===== PARCOURS ===== */
.sectitle{font-size:1.35rem;font-weight:800;margin:6px 0 14px}
.path{position:relative;margin:10px 0 30px}
.path::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;border-left:3px dashed var(--border);transform:translateX(-50%)}
.pstep{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;margin:14px 0;position:relative}
.node{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.1rem;background:var(--bg2);border:2px solid var(--border);justify-self:center;z-index:2}
.node.done{background:var(--accent);border-color:var(--accent);color:#062517}
.node.todo{border-color:var(--gold);color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
.node.locked{opacity:.5}
.lvcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;text-align:left;color:var(--text);width:100%;transition:border-color .2s,transform .2s}
.lvcard:not(:disabled):hover{border-color:var(--accent);transform:translateY(-2px)}
.lvcard:disabled{opacity:.5;cursor:not-allowed}
.lvcard .ic{font-size:1.5rem}
.lvcard h3{font-size:1.02rem;margin:2px 0}
.lvcard p{font-size:.82rem;color:var(--text2)}
.lvcard .meta{font-size:.8rem;margin-top:6px;color:var(--gold);font-weight:700}
.pstep.left .lvcard{grid-column:1}
.pstep.right .lvcard{grid-column:3}
.pstep .node{grid-column:2;grid-row:1}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.badge .bi{font-size:1.6rem}
.badge .bn{font-weight:700;font-size:.9rem}
.badge .bc{font-size:.75rem;color:var(--text2)}
.badge.off{opacity:.45;filter:grayscale(1)}
.badge.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,201,77,.25) inset}

/* ===== BRIEFING ===== */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.mhead .ic{font-size:2rem}
.mhead h2{font-size:1.4rem;line-height:1.2}
.mhead .sub{font-size:.85rem;color:var(--text2)}
.obj li{margin:5px 0 5px 20px}
.h4{font-weight:800;font-size:.95rem;margin-bottom:8px;color:var(--accent)}
.rappel p{margin:6px 0}
.exbox{border-left:4px solid var(--orange);background:rgba(255,138,61,.08);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:.92rem}
.plusbox{border-left:4px solid var(--gold);background:rgba(255,201,77,.07);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:.88rem;color:var(--text2)}
.howbox{border-left:4px solid var(--blue);background:rgba(90,169,255,.08);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:.9rem}
.pred{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pred button{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:600}
.pred button.sel{border-color:var(--gold);background:rgba(255,201,77,.12);color:var(--gold)}

/* ===== QUESTION ===== */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qtop .mt{font-size:.9rem;color:var(--text2);font-weight:600}
.qpips{display:flex;gap:6px}
.qpip{width:14px;height:14px;border-radius:50%;background:var(--bg2);border:1px solid var(--border)}
.qpip.g{background:var(--success);border-color:var(--success)}
.qpip.o{background:var(--orange);border-color:var(--orange)}
.qpip.r{background:var(--error);border-color:var(--error)}
.qpip.cur{border:2px solid var(--gold);background:rgba(255,201,77,.25)}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px}
.qcard.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.qlabel{font-size:.78rem;color:var(--text3);font-weight:600;margin-bottom:8px}
.qtext{font-size:1.08rem;font-weight:600;margin:10px 0 12px}
.data{display:block;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.95rem;color:var(--text);margin:8px 0}
.ansrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans{background:var(--bg3);border:2px solid var(--border);border-radius:10px;color:var(--text);font-family:'Space Mono',monospace;font-size:1.05rem;padding:10px 12px;width:220px;max-width:100%}
.ans:focus{border-color:var(--gold);outline:none}
.ans.ok{border-color:var(--success)}
.ans.ko{border-color:var(--error)}
.preview{font-family:'Space Mono',monospace;font-size:.85rem;color:var(--gold);min-height:1.3em;margin-top:6px}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:.93rem}
.fb.ok{background:rgba(34,214,138,.1);border:1px solid rgba(34,214,138,.45)}
.fb.mid{background:rgba(255,138,61,.1);border:1px solid rgba(255,138,61,.45)}
.fb.ko{background:rgba(255,64,96,.1);border:1px solid rgba(255,64,96,.45)}
.fb.hint{background:rgba(255,201,77,.08);border:1px solid rgba(255,201,77,.4)}
.fb.info{background:rgba(90,169,255,.08);border:1px solid rgba(90,169,255,.4)}
.fb .steps{margin-top:8px;font-family:'Space Mono',monospace;font-size:.8rem;line-height:1.7}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--gold);background:rgba(255,201,77,.1)}
.opt.good{border-color:var(--success);background:rgba(34,214,138,.12)}
.opt.bad{border-color:var(--error);background:rgba(255,64,96,.1);text-decoration:line-through}
.opt.miss{border:2px dashed var(--success)}
.opt:disabled{cursor:default}
.vfrow{display:flex;gap:10px}
.vfrow .opt{flex:1;text-align:center;font-weight:800;font-size:1.05rem}

/* éléments : réserve, zones, emplacements */
.reserve{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:1px dashed var(--border);border-radius:12px;background:var(--bg3);margin:10px 0}
.reserve:empty::after{content:"Réserve vide";color:var(--text3);font-size:.8rem;align-self:center}
.chip{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 12px;font-size:.9rem;text-align:left}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,201,77,.35)}
.chip.g{border-color:var(--success);background:rgba(34,214,138,.14);cursor:default}
.chip.o{border-color:var(--orange);background:rgba(255,138,61,.14);cursor:default}
.chip.r{border-color:var(--error);background:rgba(255,64,96,.12);cursor:default}
.chip .fix{display:block;font-size:.78rem;color:var(--gold);margin-top:2px}
.bounce{animation:bounce .5s ease}
@keyframes bounce{0%{transform:scale(.6)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.zones{display:grid;gap:10px}
.zones.z2{grid-template-columns:1fr 1fr}
.zones.z3{grid-template-columns:repeat(3,1fr)}
.zone{background:var(--bg2);border:2px solid var(--border);border-radius:12px;padding:10px;min-height:120px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:6px}
.zone.target{border-color:var(--gold);border-style:dashed}
.zone .zt{font-weight:800;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.slots{display:grid;gap:8px;margin:10px 0}
.slot{display:flex;gap:10px;align-items:center;background:var(--bg2);border:2px solid var(--border);border-radius:12px;padding:8px 10px;text-align:left;color:var(--text);min-height:48px}
.slot .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);font-weight:800;font-size:.85rem;flex:none}
.slot.target{border-color:var(--gold);border-style:dashed}
.slot.g{border-color:var(--success)} .slot.o{border-color:var(--orange)} .slot.r{border-color:var(--error)}
.slot .ph{color:var(--text3);font-size:.85rem}
.slot .fix{display:block;font-size:.78rem;color:var(--gold)}
.pairs{display:grid;gap:10px}
.pairrow{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.pairrow select{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-family:'Space Mono',monospace;font-size:.85rem;width:100%}
.pairrow .lk{font-family:'Space Mono',monospace;font-size:.85rem;padding:6px 8px;border-radius:8px}
.pairrow.g{border-color:var(--success)} .pairrow.o{border-color:var(--orange)} .pairrow.r{border-color:var(--error)}
.trous{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;line-height:2.3;font-size:.98rem}
.blank{display:inline-block;min-width:110px;border:none;border-bottom:2px dashed var(--gold);background:rgba(255,201,77,.08);color:var(--text);padding:0 8px;border-radius:6px 6px 0 0;font-size:.95rem;line-height:1.6}
.blank.target{background:rgba(255,201,77,.22)}
.blank.g{border-bottom:2px solid var(--success);background:rgba(34,214,138,.14)}
.blank.o{border-bottom:2px solid var(--orange);background:rgba(255,138,61,.14)}
.blank.r{border-bottom:2px solid var(--error);background:rgba(255,64,96,.12)}
.blank .fix{color:var(--gold);font-size:.8rem}
.sents{display:grid;gap:8px;margin-top:12px}
.sent{text-align:left;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 12px;font-size:.93rem;display:flex;gap:10px}
.sent .mk{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--text3);display:grid;place-items:center;font-size:.75rem}
.sent.flag{border-color:var(--error)} .sent.flag .mk{border-color:var(--error);background:var(--error);color:#fff}
.sent.g{border-color:var(--success);background:rgba(34,214,138,.1)} .sent.o{border-color:var(--orange);background:rgba(255,138,61,.1)}
.sent.r{border-color:var(--error);background:rgba(255,64,96,.08)} .sent.v{opacity:.7;border-style:dashed}
.sent .fix{display:block;color:var(--gold);font-size:.82rem;margin-top:4px}
.sent:disabled{cursor:default}

/* ===== DOCUMENT : LA FACTURE ===== */
.paper-wrap{overflow-x:auto;margin:12px -4px;padding:6px 4px 14px}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 22px 50px rgba(0,0,0,.5);position:relative;padding:22px 24px 18px;min-width:560px;font-size:.86rem}
.paper::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--vc,#334);border-radius:6px 6px 0 0}
.pp-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.pp-vendor{display:flex;gap:10px;align-items:flex-start}
.pp-logo{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:1.4rem;background:color-mix(in srgb,var(--vc,#334) 18%,white);flex:none}
.pp-vname{font-weight:800;font-size:1.02rem}
.pp-small{font-size:.74rem;color:var(--ink2);line-height:1.4}
.pp-kind{text-align:right}
.pp-title{font-weight:800;font-size:1.35rem;letter-spacing:1.5px;color:var(--vc,#334)}
.pp-meta{margin-left:auto;font-size:.74rem;border-collapse:collapse}
.pp-meta td{padding:1px 0 1px 10px;color:var(--ink2)} .pp-meta td+td{color:var(--ink);font-weight:600;text-align:right}
.pp-mid{display:flex;justify-content:space-between;gap:16px;margin-top:14px;align-items:flex-end}
.pp-client{border:1px solid var(--rule);border-radius:6px;padding:8px 12px;font-size:.8rem;min-width:46%;margin-left:auto}
.pp-lbl{font-size:.68rem;color:var(--ink2);font-weight:700}
.pp-cond{font-size:.78rem;background:#f1eee5;border-radius:6px;padding:7px 10px;margin-top:12px;color:var(--ink)}
table.inv{width:100%;border-collapse:collapse;margin-top:12px}
table.inv th{font-size:.7rem;color:var(--ink2);font-weight:700;text-align:right;border-bottom:2px solid var(--ink);padding:5px 6px}
table.inv th.l,table.inv td.l{text-align:left}
table.inv td{border-bottom:1px solid var(--rule);padding:6px;text-align:right;font-family:'Space Mono',monospace;font-size:.8rem;vertical-align:middle;white-space:nowrap}
table.inv td.l{white-space:normal}
table.inv td.l{font-family:'Outfit',sans-serif;font-size:.84rem}
.pp-sub{font-size:.74rem;font-weight:700;color:var(--ink2);margin-top:12px}
.pp-bottom{display:flex;justify-content:flex-end;margin-top:12px}
table.recap{border-collapse:collapse;min-width:58%}
table.recap td{padding:5px 8px;border-bottom:1px solid var(--rule);font-size:.82rem}
table.recap td:not(:first-child){text-align:right;font-family:'Space Mono',monospace;font-size:.8rem}
table.recap th{font-size:.7rem;color:var(--ink2);text-align:right;padding:4px 8px;border-bottom:2px solid var(--ink)}
table.recap tr.tot td{border-top:2px solid var(--ink);border-bottom:none;font-weight:800;font-size:.9rem;padding-top:8px}
.pp-foot{margin-top:14px;padding-top:8px;border-top:1px dashed var(--rule);font-size:.7rem;color:var(--ink2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fld{width:7.6em;font-family:'Space Mono',monospace;font-size:.82rem;text-align:right;border:none;border-bottom:2px dotted #b9a64a;background:var(--fill);color:var(--ink);padding:3px 6px;border-radius:4px 4px 0 0}
.fld:focus{outline:2px solid var(--orange);outline-offset:1px;background:#fff9dc}
.fld.bad{border-bottom:2px solid var(--error);background:#ffe3e8}
span.fld{display:inline-block}
span.fld.g{background:#dff6ea;border-bottom:2px solid #13a868;color:#0b5e3b;font-weight:700}
span.fld.o{background:#ffeadb;border-bottom:2px solid #e56f1e;color:#8a3a06;font-weight:700}

const NB = '\u202f';

function evalExpr(s){

  if (!/^[0-9+\-*/().]+$/.test(e) || !/[+\-*/]/.test(e.slice(1))) return null;

  const r = evalExpr(s); if (r !== null) return r;

function docFields(doc){
  const out = [];
  doc.lines.forEach(x => { if (x.t && typeof x.t === 'object') out.push(x.t); });
  (doc.recap||[]).forEach(r => { if (r.f) out.push(r.f); });
  if (doc.recap2){ doc.recap2.rows.forEach(r => r.cells.forEach(c => { if (c && typeof c === 'object') out.push(c); })); (doc.recap2.after||[]).forEach(r => { if (r.f) out.push(r.f); }); }
  return out;
}

const DECALAGE = [2,0,3,1, 1,3,0,2, 3,1,2,0, 0,2,1,3, 2,3,0,1];
(function melangerPropositions(liste){
  let k = 0;
  liste.forEach(q => {
    if (q.type !== 'qcm') return;
    const t = DECALAGE[k++ % DECALAGE.length];
    for (let n = 0; n < t; n++){ q.options.unshift(q.options.pop()); q.correct = (q.correct + 1) % q.options.length; }
  });
})(LEVELS.flatMap(lv => lv.questions));

function key(l,i){ return l + '_' + i; }

function S(l,i){
  const k = key(l,i);
  if (APP.qs[k]) return APP.qs[k];
  const Q = getQ(l,i);
  const st = { att:0, done:false, status:null, earned:0, firstPts:0, fb:null, sel:null, place:{}, es:{}, vals:{}, fs:{}, bad:{}, flags:{}, fa:0, elim:{}, smSel:{}, bounced:{} };
  const seed = l*31 + i*7 + 11;
  if (Q.type === 'classement') st.order = shuffled(Q.items.length, seed);
  if (Q.type === 'appariement'){ Q._pool = Q._pool || Q.pairs.map(p => p.r).concat(Q.distract); st.order = shuffled(Q._pool.length, seed); }
  if (Q.type === 'ordre'){ Q._labels = Q._labels || Q.steps.concat(Q.distract); st.order = shuffled(Q._labels.length, seed); }
  if (Q.type === 'trous'){ Q._bank = Q._bank || Q.answers.concat(Q.distract); st.order = shuffled(Q._bank.length, seed); }
  if (Q.type === 'sm') st.order = shuffled(Q.options.length, seed);
  APP.qs[k] = st; return st;
}

function rQcm(l,i,Q,st){
  return `${Q.data ? `<span class="data">${Q.data}</span>` : ''}<div class="qtext">${Q.q}</div><div class="opts">${
    Q.options.map((o,k) => {
      let c = '';
      if (st.done){ if (k === Q.correct) c = 'good'; else if (st.elim[k] || st.sel === k) c = 'bad'; }
      else if (st.elim[k]) c = 'bad'; else if (st.sel === k) c = 'sel';
      return `<button class="opt ${c}" data-i="${k}" ${st.done || st.elim[k] ? 'disabled' : ''} onclick="pickOpt(${k})">${o}</button>`;
    }).join('')}</div>`;
}

function rVf(l,i,Q,st){

    return `<button class="opt ${c}" data-v="${v}" ${st.done?'disabled':''} onclick="ansVF(${v})">${t}</button>`; };
  return `${Q.data ? `<span class="data">${Q.data}</span>` : ''}<div class="qtext">${Q.q}</div><div class="vfrow">${b(true,'✔️ Vrai')}${b(false,'✖️ Faux')}</div>`;

/* ---------- Sélection multiple ---------- */
function rSm(l,i,Q,st){
  return `${Q.data ? `<span class="data">${Q.data}</span>` : ''}<div class="qtext">${Q.q}</div><div class="opts">${
    st.order.map(k => { const o = Q.options[k], on = !!st.smSel[k]; let c = on ? 'sel' : '';
      if (st.done){ if (o.ok && on) c = 'good'; else if (o.ok && !on) c = 'miss'; else if (!o.ok && on) c = 'bad'; else c = ''; }
      return `<button class="opt ${c}" data-i="${k}" ${st.done?'disabled':''} onclick="toggleSM(${k})">${on ? '☑️' : '⬜'} ${o.t}</button>`; }).join('')}</div>`;
}
function toggleSM(k){ const st = S(APP.level, APP.q); if (st.done) return; st.smSel[k] = !st.smSel[k]; render(); }

/* ---------- Classement par zones ---------- */
function chipCls(st, e){ return st.es[e] ? st.es[e] : (st.sel === e ? 'sel' : ''); }
function rClassement(l,i,Q,st){
  const res = st.order.filter(e => st.place[e] == null).map(e =>
    `<button class="chip ${st.sel===e?'sel':''} ${st.bounced[e]?'bounce':''}" data-i="${e}" onclick="selItem(${e})">${Q.items[e].t}</button>`).join('');
  const zones = Q.zones.map((z,zi) => {
    const inside = st.order.filter(e => st.place[e] === zi).map(e => {
      const s = st.es[e] || ''; const fix = s === 'r' ? `<span class="fix">→ ${Q.zones[Q.items[e].z]}</span>` : '';
      return `<button class="chip ${s}" data-i="${e}" ${s?'disabled':''} onclick="event.stopPropagation();unplace(${e})">${Q.items[e].t}${fix}</button>`; }).join('');
    return `<div class="zone ${st.sel!=null?'target':''}" role="button" tabindex="0" data-z="${zi}" onclick="placeItem(${zi})" onkeydown="if(event.key==='Enter')placeItem(${zi})"><div class="zt">${z}</div>${inside}</div>`; }).join('');
  st.bounced = {};
  return `<div class="qtext">${Q.q}</div><div class="reserve">${res}</div><div class="zones z${Q.zones.length}">${zones}</div>`;
}
function selItem(e){ const st = S(APP.level, APP.q), Q = getQ(APP.level, APP.q); if (st.done) return; if (Q.type === 'classement' && st.es[e]) return; st.sel = st.sel === e ? null : e; render(); }
function placeItem(z){ const st = S(APP.level, APP.q); if (st.done || st.sel == null) return; st.place[st.sel] = z; st.sel = null; render(); }
function unplace(e){ const st = S(APP.level, APP.q); if (st.done || st.es[e]) return; delete st.place[e]; render(); }

/* ---------- Appariement ---------- */
function rAppariement(l,i,Q,st){
  const pool = Q._pool;
  const rows = Q.pairs.map((p,e) => {
    const s = st.es[e] || ''; let right;
    if (s === 'g' || s === 'o') right = `<span class="lk">✓ ${pool[st.place[e]]}</span>`;
    else if (s === 'r') right = `<span class="lk"><s>${pool[st.place[e]]}</s> → ${p.r}</span>`;
    else right = `<select class="pair" data-i="${e}" aria-label="Calcul pour la situation ${e+1}" onchange="setPair(${e},this.value)"><option value="">— choisis un calcul —</option>${
      st.order.map(k => `<option value="${k}" ${st.place[e]===k?'selected':''}>${pool[k]}</option>`).join('')}</select>`;
    return `<div class="pairrow ${s}"><div>${p.l}</div><div>${right}</div></div>`; }).join('');
  return `<div class="qtext">${Q.q}</div><div class="pairs">${rows}</div>`;
}
function setPair(e,v){ const st = S(APP.level, APP.q); if (st.done) return; if (v === '') delete st.place[e]; else st.place[e] = +v; }

/* ---------- Remise en ordre ---------- */
function rOrdre(l,i,Q,st){
  const labels = Q._labels, used = new Set(Object.values(st.place));
  const bank = st.order.filter(k => !used.has(k)).map(k =>
    `<button class="chip ${st.sel===k?'sel':''} ${st.bounced[k]?'bounce':''}" data-i="${k}" onclick="selItem(${k})">${labels[k]}</button>`).join('');
  const slots = Q.steps.map((_,s) => {
    const k = st.place[s], es = st.es[s] || '';
    const content = k != null ? `<span>${labels[k]}${es==='r'?`<span class="fix">→ ${Q.steps[s]}</span>`:''}</span>` : `<span class="ph">Clique ici pour placer l'étiquette choisie</span>`;
    return `<button class="slot ${es} ${st.sel!=null && k==null?'target':''}" data-s="${s}" ${es?'disabled':''} onclick="placeSlot(${s})"><span class="n">${s+1}</span>${content}</button>`; }).join('');
  st.bounced = {};
  return `<div class="qtext">${Q.q}</div><div class="slots">${slots}</div><div class="reserve">${bank}</div>`;
}
function placeSlot(s){
  const st = S(APP.level, APP.q); if (st.done || st.es[s]) return;
  if (st.sel != null){ st.place[s] = st.sel; st.sel = null; }
  else if (st.place[s] != null) delete st.place[s];
  render();
}

/* ---------- Texte à trous ---------- */
function rTrous(l,i,Q,st){
  const bank = Q._bank, used = new Set(Object.values(st.place));
  const parts = Q.text.split(/\{(\d+)\}/);
  let txt = '';
  parts.forEach((p,k) => {
    if (k % 2 === 0){ txt += p; return; }
    const b = +p, w = st.place[b], es = st.es[b] || '';
    const inner = w != null ? bank[w] + (es==='r' ? ` <span class="fix">→ ${Q.answers[b]}</span>` : '') : '…';
    txt += `<button class="blank ${es} ${st.sel!=null && w==null?'target':''}" data-b="${b}" ${es?'disabled':''} onclick="placeBlank(${b})">${inner}</button>`;
  });
  const chips = st.order.filter(k => !used.has(k)).map(k =>
    `<button class="chip ${st.sel===k?'sel':''} ${st.bounced[k]?'bounce':''}" data-i="${k}" onclick="selItem(${k})">${bank[k]}</button>`).join('');
  st.bounced = {};
  return `<div class="qtext">${Q.q}</div><div class="trous">${txt}</div><div class="reserve">${chips}</div>`;
}
function placeBlank(b){
  const st = S(APP.level, APP.q); if (st.done || st.es[b]) return;
  if (st.sel != null){ st.place[b] = st.sel; st.sel = null; }
  else if (st.place[b] != null) delete st.place[b];
  render();
}

/* ---------- Chasse aux erreurs ---------- */
function rChasse(l,i,Q,st){
  const ss = Q.sentences.map((s,k) => {
    const es = st.es[k] || ''; let c = es, mk = '';
    if (!es && st.flags[k]) { c = 'flag'; mk = '✕'; }
    if (es === 'g' || es === 'o') mk = '✓';
    if (es === 'r') mk = '!';
    if (es === 'v') mk = '✓';
    let note = '';
    if ((es === 'g' || es === 'o' || es === 'r') && s.fix) note = `<span class="fix">✏️ ${s.fix}</span>`;
    if (es === 'v') note = `<span class="fix">Cette phrase est juste : fausse alerte.</span>`;
    const dis = st.done || es;
    return `<button class="sent ${c}" data-i="${k}" ${dis?'disabled':''} onclick="toggleFlag(${k})"><span class="mk">${mk}</span><span>« ${s.t} »${note}</span></button>`; }).join('');
  return `<div class="qtext">${Q.q}</div>${renderDoc(Q, st, true)}<div class="sents">${ss}</div>`;
}
function toggleFlag(k){ const st = S(APP.level, APP.q); if (st.done || st.es[k]) return; st.flags[k] = !st.flags[k]; render(); }

/* ---------- Facture à compléter ---------- */
function fieldHTML(f, st, ro){
  if (ro) return fmt(f);
  if (typeof f === 'number') return fmt(f);
  const s = st.fs[f.id];
  if (s === 'g' || s === 'o') return `<span class="fld ${s}">${fmt(f.ans)}</span>`;
  if (s === 'r') return `<span class="fld r"><s>${esc(st.vals[f.id]||'—')}</s>${fmt(f.ans)}</span>`;
  return `<input class="fld${st.bad[f.id]?' bad':''}" data-f="${f.id}" inputmode="decimal" autocomplete="off" aria-label="${esc(f.label)}" value="${esc(st.vals[f.id]||'')}" oninput="onFld(this)" onfocus="onFld(this)">`;
}
function renderDoc(Q, st, ro){
  const d = Q.doc, showRate = !!d.showRate;
  const cell = t => (typeof t === 'number') ? fmt(t) : fieldHTML(t, st, false);
  let h = `<div class="paper-wrap"><div class="paper" style="--vc:${d.vendor.color}">
  <div class="pp-top">
    <div class="pp-vendor"><div class="pp-logo">${d.vendor.logo}</div><div><div class="pp-vname">${esc(d.vendor.name)}</div>
      <div class="pp-small">${d.vendor.addr.map(esc).join('<br>')}</div>
      <div class="pp-small">BCE ${d.vendor.bce} · TVA BE ${d.vendor.bce}</div></div></div>
    <div class="pp-kind"><div class="pp-title">${d.kind}</div><table class="pp-meta">${d.meta.map(m => `<tr><td>${m[0]}</td><td>${m[1]}</td></tr>`).join('')}</table></div>
  </div>
  <div class="pp-mid"><div class="pp-client"><div class="pp-lbl">Client</div><b>${esc(d.client.name)}</b><br>${d.client.addr.map(esc).join('<br>')}<br>TVA ${d.client.tva}</div></div>
  ${d.cond ? `<div class="pp-cond">${d.cond}</div>` : ''}
  <table class="inv"><thead><tr><th class="l">Désignation</th><th>Qté</th><th>P.U. HTVA</th>${showRate?'<th>TVA</th>':''}<th>Montant HTVA</th></tr></thead><tbody>
  ${d.lines.map(x => `<tr><td class="l">${x.d}</td><td>${x.q}</td><td>${fmt(x.pu)}</td>${showRate?`<td>${x.rate} %</td>`:''}<td>${cell(x.t)}</td></tr>`).join('')}
  </tbody></table>`;
  if (d.extra){
    h += `<div class="pp-sub">${d.extraTitle}</div><table class="inv"><tbody>${d.extra.map(x => `<tr><td class="l">${x.d}</td><td>${x.q} ×</td><td>${fmt(x.pu)}</td></tr>`).join('')}</tbody></table>`;
  }
  if (d.recap){
    h += `<div class="pp-bottom"><table class="recap">${d.recap.map(r => `<tr class="${r.tot?'tot':''}"><td>${r.label}</td><td>${r.f ? cell(r.f) : fmt(r.v)}</td></tr>`).join('')}</table></div>`;
  }
  if (d.recap2){
    const R = d.recap2;
    h += `<div class="pp-bottom"><table class="recap"><tr><th></th>${R.heads.map(x => `<th>${x}</th>`).join('')}</tr>
      ${R.rows.map(r => `<tr><td>${r.label}</td>${r.cells.map(c => `<td>${c ? cell(c) : ''}</td>`).join('')}</tr>`).join('')}
      ${R.after.map(r => `<tr class="${r.tot?'tot':''}"><td>${r.label}</td><td colspan="${R.heads.length}">${cell(r.f)}</td></tr>`).join('')}
    </table></div>`;
  }
  h += `<div class="pp-foot"><span>IBAN ${d.vendor.iban}</span><span>${d.foot||''}</span></div></div></div>`;
  return h;
}
function rFacture(l,i,Q,st){
  return `<div class="qtext">${Q.q}</div>${renderDoc(Q, st, false)}
  ${st.done ? '' : `<div class="calcbar" id="calcbar">🧮 Tape un nombre ou un calcul (par ex. 15*28) dans une case jaune.</div>`}`;
}
function onFld(el){
  const st = S(APP.level, APP.q); const id = el.dataset.f;
  st.vals[id] = el.value;
  if (st.bad[id] && el.classList){ /* l'élève corrige : on garde le rouge jusqu'à la vérification */ }
  const bar = document.getElementById('calcbar'); if (!bar) return;
  const r = evalExpr(el.value);
  bar.innerHTML = r === null ? `🧮 ${esc(el.getAttribute('aria-label'))} : ${el.value ? esc(el.value) : '…'}` : `🧮 ${esc(el.getAttribute('aria-label'))} : ${prettyExpr(el.value)} → = <b>${fmt(r)}</b>`;
}

/* ============================================================
   VÉRIFICATION
   ============================================================ */
function check(){
  const l = APP.level, i = APP.q, Q = getQ(l,i), st = S(l,i);
  if (st.done) return;
  switch (Q.type){
    case 'reponse': return chkReponse(l,i,Q,st);
    case 'qcm': return chkQcm(l,i,Q,st);
    case 'sm': return chkSm(l,i,Q,st);
    case 'classement': return chkClassement(l,i,Q,st);
    case 'appariement': return chkAppariement(l,i,Q,st);
    case 'ordre': return chkOrdre(l,i,Q,st);
    case 'trous': return chkTrous(l,i,Q,st);
    case 'chasse': return chkChasse(l,i,Q,st);
    case 'facture': return chkFacture(l,i,Q,st);
  }
}
function info(st, html){ st.fb = { kind:'info', html }; render(); }
function firstFail(st, html){ st.att = 1; APP.streak = 0; st.fb = { kind:'hint', html }; render(); shake(); sfx('ko'); }

function chkReponse(l,i,Q,st){
  const v = parseNum(st.val || '');
  if (!isFinite(v)) return info(st, "✍️ Écris un nombre (ou un calcul) avant de vérifier.");
  const ok = near(v, Q.ans);
  if (ok){ const p = st.att === 0 ? Q.pts : Q.pts/2;
    return finishQ(l,i, st.att === 0 ? 'correct' : 'hint', p, st.att === 0 ? Q.pts : 0, `✅ <b>Juste${st.att?' au deuxième essai':''}.</b> ${Q.expl}`); }
  if (st.att === 0) return firstFail(st, `🤔 <b>Pas encore.</b> ${Q.hint}`);
  finishQ(l,i,'shown',0,0, `❌ La bonne réponse était <b>${fmt(Q.ans)} ${Q.unit||''}</b>. ${Q.expl}`);
}
function chkQcm(l,i,Q,st){
  if (st.sel == null) return info(st, "👆 Choisis une proposition avant de vérifier.");
  if (st.sel === Q.correct){ return finishQ(l,i, st.att === 0 ? 'correct' : 'hint', st.att === 0 ? Q.pts : Q.pts/2, st.att === 0 ? Q.pts : 0, `✅ <b>Juste${st.att?' au deuxième essai':''}.</b> ${Q.expl}`); }
  if (st.att === 0){ st.elim[st.sel] = true; st.sel = null; return firstFail(st, `🤔 <b>Pas encore.</b> ${Q.hint}`); }
  finishQ(l,i,'shown',0,0, `❌ La bonne réponse : <b>${Q.options[Q.correct]}</b>. ${Q.expl}`);
}
function ansVF(v){
  const l = APP.level, i = APP.q, Q = getQ(l,i), st = S(l,i); if (st.done) return;
  st.sel = v;
  if (v === Q.ans) finishQ(l,i,'correct',Q.pts,Q.pts, `✅ <b>Juste : c'est ${Q.ans?'vrai':'faux'}.</b> ${Q.expl}`);
  else { APP.streak = 0; finishQ(l,i,'shown',0,0, `❌ <b>C'est ${Q.ans?'vrai':'faux'}.</b> ${Q.expl}`); shake(); }
}
function chkSm(l,i,Q,st){
  const sel = Q.options.map((_,k) => !!st.smSel[k]);
  if (!sel.some(Boolean)) return info(st, "☑️ Coche au moins une proposition avant de vérifier.");
  const ok = Q.options.every((o,k) => o.ok === sel[k]);
  if (ok) return finishQ(l,i, st.att === 0 ? 'correct' : 'hint', st.att === 0 ? Q.pts : Q.pts/2, st.att === 0 ? Q.pts : 0, `✅ <b>Juste${st.att?' au deuxième essai':''}.</b> ${Q.expl}`);
  if (st.att === 0) return firstFail(st, `🤔 <b>Pas tout à fait.</b> ${Q.hint}`);
  finishQ(l,i,'shown',0,0, `❌ Les bonnes réponses sont en vert ; celles que tu as oubliées sont en pointillés. ${Q.expl}`);
}

/* Barème par élément (§3.8) — factorisé */
function itemFinish(l,i,Q,st,n){
  const val = Q.pts / n; let g = 0, o = 0, r = 0;
  for (let e = 0; e < n; e++){ const s = st.es[e]; if (s === 'g') g++; else if (s === 'o') o++; else r++; }
  const earned = g*val + o*val/2, first = g*val;
  const status = r ? 'shown' : (o ? 'hint' : 'correct');
  const head = status === 'correct' ? `✅ <b>Tout est juste du premier coup.</b>` : status === 'hint' ? `🔄 <b>Tout est juste après correction</b> (${o} élément${o>1?'s':''} corrigé${o>1?'s':''}).` : `👁 <b>${g + o} élément${g+o>1?'s':''} juste${g+o>1?'s':''} sur ${n}.</b> Les corrections sont affichées.`;
  finishQ(l,i,status,earned,first, `${head} ${Q.expl}`);
}
function elemCheck(l,i,Q,st,n,isOk,clear){
  if (st.att === 0){
    let g = 0;
    for (let e = 0; e < n; e++){ if (isOk(e)){ st.es[e] = 'g'; g++; } else clear(e); }
    if (g === n) return itemFinish(l,i,Q,st,n);
    return firstFail(st, `🤔 <b>${g} élément${g>1?'s':''} juste${g>1?'s':''} sur ${n}</b> : ils sont verrouillés en vert. Les autres sont revenus à leur place de départ. <b>Indice :</b> ${Q.hint}`);
  }
  for (let e = 0; e < n; e++){ if (!st.es[e]) st.es[e] = isOk(e) ? 'o' : 'r'; }
  itemFinish(l,i,Q,st,n);
}
function chkClassement(l,i,Q,st){
  const n = Q.items.length;
  if (Q.items.some((_,e) => st.place[e] == null)) return info(st, "📥 Range toutes les étiquettes avant de vérifier.");
  elemCheck(l,i,Q,st,n, e => st.place[e] === Q.items[e].z, e => { delete st.place[e]; st.bounced[e] = true; });
}
function chkAppariement(l,i,Q,st){
  const n = Q.pairs.length;
  if (Q.pairs.some((_,e) => st.place[e] == null)) return info(st, "🔽 Choisis un calcul pour chaque situation avant de vérifier.");
  elemCheck(l,i,Q,st,n, e => Q._pool[st.place[e]] === Q.pairs[e].r, e => { delete st.place[e]; });
}
function chkOrdre(l,i,Q,st){
  const n = Q.steps.length;
  if (Q.steps.some((_,s) => st.place[s] == null)) return info(st, "🔢 Remplis tous les emplacements avant de vérifier.");
  elemCheck(l,i,Q,st,n, s => st.place[s] === s, s => { st.bounced[st.place[s]] = true; delete st.place[s]; });
}
function chkTrous(l,i,Q,st){
  const n = Q.answers.length;
  if (Q.answers.some((_,b) => st.place[b] == null)) return info(st, "🧩 Remplis tous les trous avant de vérifier.");
  elemCheck(l,i,Q,st,n, b => Q._bank[st.place[b]] === Q.answers[b], b => { st.bounced[st.place[b]] = true; delete st.place[b]; });
}
function chkChasse(l,i,Q,st){
  const errs = Q.sentences.map((s,k) => s.err ? k : -1).filter(k => k >= 0), n = errs.length, val = Q.pts / n;
  const flagged = Q.sentences.map((_,k) => k).filter(k => st.flags[k] && !st.es[k]);
  if (!flagged.length && st.att === 0) return info(st, "🔍 Clique sur au moins une phrase que tu crois fausse avant de vérifier.");
  let fa = 0;
  flagged.forEach(k => { if (Q.sentences[k].err) st.es[k] = st.att === 0 ? 'g' : 'o'; else { st.es[k] = 'v'; fa++; } st.flags[k] = false; });
  st.fa += fa; if (st.att === 0) st.fa1 = fa;
  const g = errs.filter(k => st.es[k] === 'g').length, o = errs.filter(k => st.es[k] === 'o').length;
  const allFound = g + o === n;
  if (st.att === 0 && !allFound){
    return firstFail(st, `🤔 <b>Tu as trouvé ${g} erreur${g>1?'s':''} sur ${n}.</b>${fa ? ` ${fa} fausse${fa>1?'s':''} alerte${fa>1?'s':''} : −${fa} XP.` : ''} <b>Indice :</b> ${Q.hint}`);
  }
  errs.forEach(k => { if (!st.es[k]) st.es[k] = 'r'; });
  const r = errs.filter(k => st.es[k] === 'r').length;
  const earned = Math.max(0, g*val + o*val/2 - st.fa), first = Math.max(0, g*val - (st.fa1||0));
  const status = r ? 'shown' : (o || st.fa ? 'hint' : 'correct');
  const head = status === 'correct' ? `✅ <b>Les ${n} erreurs trouvées du premier coup, sans fausse alerte.</b>` :
    `${r ? '👁' : '🔄'} <b>${g+o} erreur${g+o>1?'s':''} trouvée${g+o>1?'s':''} sur ${n}</b>${st.fa ? ` · ${st.fa} fausse${st.fa>1?'s':''} alerte${st.fa>1?'s':''} (−${st.fa} XP)` : ''}.`;
  finishQ(l,i,status,earned,first, `${head} ${Q.expl}`);
}
function chkFacture(l,i,Q,st){
  const fields = docFields(Q.doc);
  const open = fields.filter(f => !st.fs[f.id]);
  const empty = open.filter(f => !isFinite(parseNum(st.vals[f.id] || '')));
  if (empty.length) return info(st, `✍️ Remplis toutes les cases jaunes avant de vérifier (${empty.length} case${empty.length>1?'s':''} vide${empty.length>1?'s':''} ou illisible${empty.length>1?'s':''}).`);
  const n = fields.length;
  const ok = f => near(parseNum(st.vals[f.id]), f.ans);
  if (st.att === 0){
    let g = 0; st.bad = {}; let firstWrong = null;
    fields.forEach(f => { if (ok(f)){ st.fs[f.id] = 'g'; g++; } else { st.bad[f.id] = true; if (!firstWrong) firstWrong = f; } });
    if (g === n) return factureFinish(l,i,Q,st,fields);
    return firstFail(st, `🤔 <b>${g} case${g>1?'s':''} juste${g>1?'s':''} sur ${n}</b> : elles sont verrouillées en vert. Corrige les cases en rouge.<br><b>Indice — ${firstWrong.label} :</b> ${firstWrong.hint}${
      fields.indexOf(firstWrong) < n - 1 ? ' <i>Les cases qui suivent dépendent souvent de celle-ci.</i>' : ''}`);
  }
  fields.forEach(f => { if (!st.fs[f.id]) st.fs[f.id] = ok(f) ? 'o' : 'r'; });
  st.bad = {};
  factureFinish(l,i,Q,st,fields);
}
function factureFinish(l,i,Q,st,fields){
  const n = fields.length, val = Q.pts / n;
  const g = fields.filter(f => st.fs[f.id] === 'g').length, o = fields.filter(f => st.fs[f.id] === 'o').length, r = n - g - o;
  const status = r ? 'shown' : (o ? 'hint' : 'correct');
  const head = status === 'correct' ? `✅ <b>Facture parfaite : toutes les cases sont justes du premier coup.</b>` :
    status === 'hint' ? `🔄 <b>Toutes les cases sont justes après correction.</b>` : `👁 <b>${g+o} case${g+o>1?'s':''} juste${g+o>1?'s':''} sur ${n}.</b> Les bonnes valeurs sont affichées en rouge.`;
  const steps = `<div class="steps">${fields.map(f => `${f.label} : ${f.expl}`).join('<br>')}</div>`;
  finishQ(l,i,status, g*val + o*val/2, g*val, `${head}<br>Le calcul complet :${steps}`);
}

/* ============================================================
   FIN DE QUESTION, FIN DE MISSION
   ============================================================ */
function finishQ(l,i,status,earned,first,html){
  const st = S(l,i);
  st.done = true; st.status = status; st.earned = earned; st.firstPts = first;
  st.fb = { kind: status === 'correct' ? 'ok' : status === 'hint' ? 'mid' : 'ko', html };
  APP.score += earned;
  if (status === 'correct'){ APP.streak++; APP.bestStreak = Math.max(APP.bestStreak, APP.streak); }
  else APP.streak = 0;
  render();
  if (earned > 0){ particles(); floatXP('+' + earned + ' XP'); sfx('ok'); }
  if (status === 'correct' && APP.streak >= 3) combo(APP.streak);
  const Q = getQ(l,i);
  if (Q.type === 'facture' && status === 'correct') award('b2');
  if (l === 2 && i === 2 && status === 'correct') award('b3');
  if (Q.type === 'chasse' && status === 'correct') award('b4');
  if (APP.streak >= 5) award('b5');
  if (Q.defi && earned / Q.pts >= 0.8) award('b6');
  checkRank();
}
function predCat(r){ return r >= 0.875 ? 1 : r >= 0.625 ? 0.75 : 0.5; }
function finishLevel(l){
  const lv = LEVELS[l]; const qs = lv.questions.map((_,i) => S(l,i));
  const counts = { correct:0, hint:0, shown:0 };
  qs.forEach(s => counts[s.status]++);
  const earned = qs.reduce((t,s) => t + s.earned, 0), first = qs.reduce((t,s) => t + s.firstPts, 0);
  APP.done[l] = { earned, max:lv.maxPoints, first, counts, n:qs.length };
  completeExercise(l);
  if (l === 0) award('b1');
  if (predCat(counts.correct / qs.length) === APP.pred[l]) award('b7');
  if (LEVELS.every((_,k) => APP.done[k])) award('b8');
  APP.level = l; setScreen('bilan');
  if (first / lv.maxPoints >= 0.7) confetti();
  sfx('level');
}
function gradeOf(r){ return r >= 0.85 ? ['A','Excellent','Tu maîtrises : garde ce rythme.'] : r >= 0.65 ? ['B','Très bien','Quelques détails à revoir dans les corrections.'] : r >= 0.45 ? ['C','Satisfaisant','Relis les corrections avant de continuer.'] : ['D','À retravailler','Reprends ton cours et les corrections, puis refais les calculs sur papier.']; }
function medalOf(r){ return r >= 0.9 ? '🏆' : r >= 0.7 ? '🥇' : r >= 0.5 ? '🥈' : '🥉'; }
function legend(){ return `<div class="legend"><span><span class="dot" style="background:var(--success)"></span>Juste du 1er coup</span><span><span class="dot" style="background:var(--orange)"></span>Corrigé au 2e essai</span><span><span class="dot" style="background:var(--error)"></span>Réponse montrée</span></div>`; }
function renderBilan(l){
  const lv = LEVELS[l], d = APP.done[l]; if (!d) return renderHub();
  const r1 = d.first / d.max, g = gradeOf(r1);
  const p = PRED.find(x => x.v === APP.pred[l]);
  const real = predCat(d.counts.correct / d.n);
  let predTxt = '';
  if (p){ predTxt = `Tu avais prédit <b>${p.n}</b> ; tu as réussi <b>${d.counts.correct}/${d.n}</b> questions du premier coup. ` +
    (real === p.v ? "Bonne estimation, tu te connais bien !" : real > p.v ? "Tu as fait mieux que prévu : tu peux avoir davantage confiance en toi." : "C'était plus difficile que prévu : relis bien les corrections affichées."); }
  const rows = lv.questions.map((q,i) => { const s = S(l,i); const ic = s.status === 'correct' ? '✅' : s.status === 'hint' ? '🔄' : '👁';
    return `<tr><td>${i+1}. ${qLabel(q).split(' — ')[0]}</td><td class="n">${ic}</td><td class="n">${s.earned}/${q.pts}</td></tr>`; }).join('');
  const last = l === LEVELS.length - 1;

    <p style="text-align:center;color:var(--text2);margin-top:4px">${d.earned}/${d.max} XP · réussite au 1er essai : ${Math.round(r1*100)} % · ${g[2]}</p>

    ${predTxt ? `<div class="predline">🔮 ${predTxt}</div>` : ''}

/* Bilan par critères et indicateurs (§4.11) */
function bilanIndicateurs(){
  const acc = {};
  LEVELS.forEach((lv,l) => lv.questions.forEach((q,i) => {
    const a = acc[q.ind] || (acc[q.ind] = { pts:0, max:0 });
    a.max += q.pts; a.pts += (APP.qs[key(l,i)] && APP.qs[key(l,i)].earned) || 0;
  }));
  const statut = r => r >= 0.8 ? 'atteint' : r >= 0.5 ? 'encours' : 'nonatteint';
  return CRITERES.map(c => {
    const inds = c.indicateurs.map(ind => { const a = acc[ind.id] || { pts:0, max:0 }; const r = a.max ? a.pts/a.max : 0; return Object.assign({}, ind, { ratio:r, statut:statut(r) }); });
    const tot = c.indicateurs.reduce((t,ind) => { const a = acc[ind.id] || { pts:0, max:0 }; return { pts:t.pts + a.pts, max:t.max + a.max }; }, { pts:0, max:0 });
    const r = tot.max ? tot.pts/tot.max : 0;
    return { id:c.id, nom:c.nom, ratio:r, statut:statut(r), indicateurs:inds };
  });
}
const ST_LBL = { atteint:'✅ Atteint', encours:'🟠 En cours d\'acquisition', nonatteint:'❌ Non atteint' };
function renderFinal(){
  const tot = LEVELS.reduce((t,_,l) => { const d = APP.done[l]; return { e:t.e + d.earned, m:t.m + d.max, f:t.f + d.first, c:t.c + d.counts.correct, h:t.h + d.counts.hint, s:t.s + d.counts.shown }; }, { e:0, m:0, f:0, c:0, h:0, s:0 });
  const r1 = tot.f / tot.m, g = gradeOf(r1), rk = RANKS[rankIndex(APP.score)];
  const name = APP.email ? APP.email.split('@')[0].split(/[._-]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ') : '';
  const today = new Date().toLocaleDateString('fr-BE');
  const crit = bilanIndicateurs();
  const allOk = crit.every(c => c.indicateurs.every(i => i.statut === 'atteint'));
  const rows = LEVELS.map((lv,l) => { const d = APP.done[l]; return `<tr><td>${lv.icon} Mission ${l+1}</td><td class="n">${d.counts.correct}</td><td class="n">${d.counts.hint}</td><td class="n">${d.counts.shown}</td><td class="n">${starsFor(d.earned/d.max)}</td><td class="n">${d.earned}/${d.max}</td></tr>`; }).join('');
  setTimeout(() => { if (r1 >= 0.7 && !APP.finalConfetti){ APP.finalConfetti = true; confetti(); } }, 300);
  return `<div class="panel final fiche" id="finalBilan">
    <div class="medal">${medalOf(r1)}</div>
    <div class="grade">Parcours terminé — ${g[0]} · ${g[1]}</div>
    <p style="text-align:center;color:var(--text2)">${name ? esc(name) + ' · ' : ''}${today} · ${tot.e}/${tot.m} XP · réussite au 1er essai : ${Math.round(r1*100)} %<br>Rang atteint : ${rk.icon} ${rk.name} · meilleure série : ${APP.bestStreak} · badges : ${APP.badges.size}/${BADGES.length}</p>
    ${legend()}
    <table class="res"><tr><th>Mission</th><th style="text-align:center">✅</th><th style="text-align:center">🔄</th><th style="text-align:center">👁</th><th style="text-align:center">Étoiles</th><th style="text-align:center">XP</th></tr>${rows}
    <tr><td><b>Total</b></td><td class="n"><b>${tot.c}</b></td><td class="n"><b>${tot.h}</b></td><td class="n"><b>${tot.s}</b></td><td></td><td class="n"><b>${tot.e}/${tot.m}</b></td></tr></table>
    <h3 style="margin-top:18px;font-size:1.1rem">📋 Ce que tu maîtrises</h3>
    ${crit.map(c => `<div class="crit"><h4><span>${c.id} — ${c.nom}</span><span class="st ${c.statut}">${ST_LBL[c.statut]}</span></h4>
      ${c.indicateurs.map(i => `<div class="ind"><span>${i.texte}</span><span class="st ${i.statut}">${ST_LBL[i.statut]}</span></div>
        ${i.statut !== 'atteint' ? `<div class="rev">📖 À revoir dans ton cours : <i>${i.chapitre}</i> — ${i.revoir}.</div>` : ''}`).join('')}</div>`).join('')}
    ${allOk ? `<p class="predline">🎉 Tous les indicateurs sont atteints : tu sais compléter et rectifier une facture. Bravo pour ce travail régulier !</p>` : ''}
    <div class="btnrow c noprint">
      <button class="btn ghost" onclick="window.print()">🖨️ Imprimer mon bilan</button>
      <button class="lbbtn app" onclick="openLB('app')">🏆 Classement</button>
      <button class="lbbtn glob" onclick="openLB('global')">🌍 Général</button>
      <button class="btn orange" id="btnReplay" onclick="restartGame()">🔁 Rejouer</button>
    </div></div>`;
}

const toastQ = []; let toastBusy = false;

document.addEventListener('pointerdown', e => { APP.lastXY = [e.clientX, e.clientY]; }, true);
function origin(){ if (APP.lastXY) return APP.lastXY; return [window.innerWidth/2, window.innerHeight/2]; }
function particles(){
  const [x,y] = origin(); const cols = ['#22d68a','#ffc94d','#ff8a3d','#5aa9ff'];
  for (let k = 0; k < 16; k++){ const p = document.createElement('span'); p.className = 'particle';
    const a = Math.random()*Math.PI*2, d = 40 + Math.random()*60;

    p.style.setProperty('--dx', Math.cos(a)*d + 'px'); p.style.setProperty('--dy', Math.sin(a)*d + 'px');
    document.body.appendChild(p); setTimeout(() => p.remove(), 900); }
}
function floatXP(t){ const [x,y] = origin(); const f = document.createElement('span'); f.className = 'floatxp'; f.textContent = t; f.style.left = (x - 20) + 'px'; f.style.top = (y - 30) + 'px'; document.body.appendChild(f); setTimeout(() => f.remove(), 1200); }
function combo(n){ const c = document.createElement('div'); c.className = 'combo'; c.textContent = n >= 10 ? '⚡ INARRÊTABLE ×' + n : n >= 5 ? '🔥 EN FEU ×' + n : '🔥 COMBO ×' + n; document.body.appendChild(c); setTimeout(() => c.remove(), 1200); }
function confetti(){

  for (let k = 0; k < 70; k++){ const c = document.createElement('span'); c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw'; c.style.background = cols[k%5]; c.style.animationDuration = (2 + Math.random()*1.8) + 's'; c.style.animationDelay = (Math.random()*0.4) + 's';

}

/* Sons Web Audio — coupés par défaut (§4.10) */
let AC = null;
function tone(freq, start, dur, type, vol){
  if (!AC) return; const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = freq; g.gain.value = vol || 0.08;
  o.connect(g); g.connect(AC.destination); const t = AC.currentTime + start;
  o.start(t); g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.stop(t + dur + 0.02);
}
function sfx(kind){
  if (!APP.sound || !AC) return;
  if (kind === 'ok'){ tone(660,0,.12); tone(990,.1,.16); }
  else if (kind === 'ko'){ tone(220,0,.18,'triangle',.06); }
  else if (kind === 'badge'){ tone(784,0,.12); tone(988,.1,.12); tone(1319,.2,.2); }
  else if (kind === 'level'){ tone(523,0,.12); tone(659,.1,.12); tone(784,.2,.12); tone(1047,.3,.25); }
}
function toggleSound(){
  APP.sound = !APP.sound;
  if (APP.sound && !AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ APP.sound = false; } }
  document.getElementById('btnSound').textContent = APP.sound ? '🔊' : '🔇';
  if (APP.sound) sfx('ok');
}

function showEmailModal(){

function validateEmail(){
  const input = document.getElementById('emailInput');
  const btn = document.getElementById('emailBtn');
  const errDiv = document.getElementById('emailError');
  const email = input.value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    errDiv.textContent = '⚠️ Entre une adresse email valide.'; input.style.borderColor = '#ff4060'; return;
  }
  btn.textContent = '⏳ Vérification…'; btn.disabled = true; errDiv.textContent = ''; input.style.borderColor = '';
  const cbName = '_emailCb_' + Date.now();
  const timeout = setTimeout(() => {
    delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove();
    errDiv.textContent = '⚠️ Connexion impossible. Vérifie ta connexion internet.';
    btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false;
  }, 10000);
  window[cbName] = function(resp){
    clearTimeout(timeout); delete window[cbName];
    const s = document.getElementById(cbName); if (s) s.remove();
    btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false;
    if (resp && resp.found){
      const oldEmail = localStorage.getItem('student_email');
      localStorage.setItem('student_email', email);
      localStorage.setItem('student_classe', resp.classe || '');
      APP.email = email; APP.classe = resp.classe || '';
      if (oldEmail && oldEmail !== email) resetProgression();
      TRACKING.sessionId = new Date().toISOString();
      document.getElementById('emailOverlay').style.display = 'none';
      startGlobalTimer();
      onEmailValidated();
    } else {
      errDiv.textContent = "⚠️ Cette adresse email n'est pas enregistrée. Vérifie l'orthographe ou demande à ton professeur de t'ajouter à la liste.";
      input.style.borderColor = '#ff4060';
    }
  };
  const s = document.createElement('script');
  s.id = cbName;
  s.src = `${TRACKING.scriptUrl}?action=check_email&email=${encodeURIComponent(email)}&callback=${cbName}`;
  s.onerror = () => { clearTimeout(timeout); delete window[cbName]; s.remove(); errDiv.textContent = '⚠️ Erreur de connexion au serveur.'; btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false; };
  document.body.appendChild(s);
}

/* TRACKING — Chronomètres */
function startGlobalTimer(){
  APP.globalTimerStart = Date.now();
  const el = document.getElementById('globalTimer'); if (el) el.style.display = 'inline';
  if (APP.globalTimerInterval) clearInterval(APP.globalTimerInterval);
  APP.globalTimerInterval = setInterval(updateTimerDisplay, 1000); updateTimerDisplay();
}
function updateTimerDisplay(){
  const el = document.getElementById('globalTimer'); if (!el || !APP.globalTimerStart) return;
  const elapsed = Math.floor((Date.now() - APP.globalTimerStart) / 1000);
  el.textContent = '⏱️ ' + String(Math.floor(elapsed/60)).padStart(2,'0') + ':' + String(elapsed%60).padStart(2,'0');
}
function startExerciseTimer(exIdx){ APP.exerciseStartTime = Date.now(); APP.scoreBeforeExercise = APP.score || 0; }
function stopExerciseTimer(exIdx){
  if (!APP.exerciseStartTime) return null;
  const tempsSec = Math.round((Date.now() - APP.exerciseStartTime) / 1000);
  APP.exerciseTimes[exIdx] = tempsSec; APP.exerciseStartTime = null; APP.timerLevel = null;
  const deltaPoints = (APP.score || 0) - APP.scoreBeforeExercise;
  APP.exerciseScores[exIdx] = deltaPoints;
  return { points: deltaPoints, temps: tempsSec };
}
function completeExercise(idx){
  if (APP.completed.has(idx)) return;      // anti-doublon
  APP.completed.add(idx);
  const result = stopExerciseTimer(idx);
  if (result) sendResult(LEVELS[idx].trackName, result.points, LEVELS[idx].maxPoints, result.temps);
}
function formatTime(s){ const m = Math.floor(s/60); return m > 0 ? m + 'm' + String(s%60).padStart(2,'0') + 's' : s + 's'; }

  if (tab === 'app'){ btnApp.style.background = 'var(--accent)'; btnApp.style.color = '#0f1117'; btnGlobal.style.background = 'transparent'; btnGlobal.style.color = 'var(--orange)'; }
  else { btnGlobal.style.background = 'var(--orange)'; btnGlobal.style.color = '#0f1117'; btnApp.style.background = 'transparent'; btnApp.style.color = 'var(--accent)'; }
  fetchLeaderboard(tab);
}
function fetchLeaderboard(tab){
  const content = document.getElementById('lbContent');
  content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2);">⏳ Chargement…</div>';
  const action = tab === 'app' ? 'leaderboard_app' : 'leaderboard_global';
  const cbName = '_lbCb_' + Date.now();
  const timeout = setTimeout(() => {
    delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove();
    content.innerHTML = '<div style="text-align:center;padding:40px;"><div style="color:#ff4060;margin-bottom:12px;">⚠️ Connexion impossible</div><button onclick="fetchLeaderboard(\'' + tab + '\')" style="padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-family:inherit;">Réessayer</button></div>';
  }, 10000);
  window[cbName] = function(resp){
    clearTimeout(timeout); delete window[cbName];
    const s = document.getElementById(cbName); if (s) s.remove();
    const lbData = resp && (resp.leaderboard || resp.data);
    if (!lbData || lbData.length === 0){ content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2);">🏁 Aucun résultat pour le moment</div>'; return; }
    renderLeaderboard(lbData, tab);
  };
  let url = `${TRACKING.scriptUrl}?action=${action}&callback=${cbName}&mode=last`;
  if (tab === 'app') url += `&app=${encodeURIComponent(TRACKING.appName)}`;
  if (APP.classe) url += `&classe=${encodeURIComponent(APP.classe)}`;
  const s = document.createElement('script'); s.id = cbName; s.src = url;
  s.onerror = () => { clearTimeout(timeout); delete window[cbName]; s.remove(); content.innerHTML = '<div style="text-align:center;padding:40px;color:#ff4060;">⚠️ Erreur de connexion</div>'; };
  document.body.appendChild(s);
}
function renderLeaderboard(data, tab){
  const content = document.getElementById('lbContent');
  const myEmail = (APP.email || '').toLowerCase();
  if (tab === 'global' && data.length > 0){
    data = data.slice().sort((a,b) => { const pA = (a.pct != null ? a.pct : (a.pourcentage || 0)), pB = (b.pct != null ? b.pct : (b.pourcentage || 0)); if (pB !== pA) return pB - pA; return (a.totalTemps || a.totalTime || 0) - (b.totalTemps || b.totalTime || 0); });
    data.forEach((entry,i) => { entry.rang = i + 1; });
  }
  const me = data.find(r => r.email === myEmail);
  let html = '';
  if (me){
    const pct = me.pct != null ? me.pct : (me.pourcentage != null ? me.pourcentage : 0);
    const count = tab === 'app' ? (me.niveauxCompletes || me.niveaux || 0) : (me.appsCompletes || me.apps || 0);
    const total = tab === 'app' ? (me.totalNiveaux || 0) : (me.totalPossibleNiveaux || 0);
    const label = tab === 'app' ? 'niveaux' : 'apps';
    const prog = total > 0 ? count + '/' + total + ' ' + label : count + ' ' + label;
    html += `<div style="background:rgba(34,214,138,0.08);border:1px solid rgba(34,214,138,0.3);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;justify-content:space-around;text-align:center;gap:8px;flex-wrap:wrap">
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--accent);">#${me.rang}</div><div style="font-size:0.7rem;color:var(--text2);">Rang</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;">${me.totalPoints}</div><div style="font-size:0.7rem;color:var(--text2);">Points</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:${pct>=80?'#22d68a':pct>=50?'#ff8a3d':'#ff4060'};">${pct}%</div><div style="font-size:0.7rem;color:var(--text2);">Réussite</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--text2);">${prog}</div><div style="font-size:0.7rem;color:var(--text2);">Progression</div></div></div>`;
  }
  const medals = ['🥇','🥈','🥉'];
  html += '<table style="width:100%;border-collapse:collapse;font-size:0.85rem;"><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:0.72rem;">#</th><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:0.72rem;">Élève</th><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:0.72rem;">Progression</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:0.72rem;">Pts</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:0.72rem;">%</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:0.72rem;">Temps</th></tr>';
  data.forEach(row => {
    const r = row.rang || 0;
    const name = String(row.email || '').split('@')[0].split(/[._-]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const pct = row.pct != null ? row.pct : (row.pourcentage != null ? row.pourcentage : 0);
    const temps = row.totalTemps || row.totalTime || 0;
    const count = tab === 'app' ? (row.niveauxCompletes || row.niveaux || 0) : (row.appsCompletes || row.apps || 0);
    const total = tab === 'app' ? (row.totalNiveaux || 0) : (row.totalPossibleNiveaux || 0);
    const bar = total > 0 ? Math.min(100, Math.round(count/total*100)) : 0;
    const isMe = row.email === myEmail;
    const pctC = pct >= 80 ? '#22d68a' : pct >= 50 ? '#ff8a3d' : '#ff4060';
    const tStr = temps > 0 ? formatTime(temps) : '—';
    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.03);background:${isMe?'rgba(34,214,138,0.08)':'transparent'};"><td style="padding:8px 4px;font-weight:700;">${r<=3 && r>0 ? medals[r-1] : r}</td><td style="padding:8px 4px;${isMe?'font-weight:800;color:var(--accent);':''}">${esc(name)}</td><td style="padding:8px 4px;"><div style="height:6px;border-radius:4px;background:var(--bg3);width:70px;overflow:hidden"><div style="height:100%;width:${bar}%;background:var(--accent)"></div></div></td><td style="padding:8px 4px;text-align:right;font-weight:700;color:var(--accent);">${row.totalPoints}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:${pctC};">${pct}%</td><td style="padding:8px 4px;text-align:right;color:var(--text2);font-family:monospace;font-size:0.78rem;">${tStr}</td></tr>`;
  });
  html += '</table>';
  content.innerHTML = html;
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  renderScreen();
  showEmailModal();   // ← TOUJOURS, même si email en localStorage
}
init();
</script>
